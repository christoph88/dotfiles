# tmux open pane in same directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Make sure we're using the proper TERM
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-ghostty:hyperlinks,xterm-ghostty:extkeys"
set -g extended-keys always
set -g extended-keys-format csi-u

# Allow escape sequence passthrough (notifications, etc.)
set -g allow-passthrough on

# window titles
set -g set-titles on

# Use prefix+r to reload configuration
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# enable mouse
set -g mouse on

# Copy mouse selection to system clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Enable vi mode
setw -g mode-keys vi
set -g status-keys vi

# automatic window renaming — default name is folder basename, manual renames (prefix + ,) stick
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g window-status-format '#I:#W#F'
set -g window-status-current-format '#I:#W#F'

# status bar updates every 15s by default**, change to 1s here
set -g status-interval 1

# widen left status so session name isn't truncated (default is 10)
set -g status-left-length 40

# Smart pane switching with awareness of vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
set -g @plugin 'christoomey/vim-tmux-navigator'

# Vim-like resizing of panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
